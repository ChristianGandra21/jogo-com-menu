<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo com Menu</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style> body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; } </style>
</head>
<body>
    <script>
        class MenuScene extends Phaser.Scene {
            constructor() {
                super({ key: 'MenuScene' });
            }

            preload() {
                this.load.image('play', 'assets/play.png'); 
                this.load.image('bg-menu', 'assets/bg_menu.png');
                this.load.image('menu', 'assets/menu.png'); 
            }

            create() {
                this.add.image(400, 300, 'bg-menu').setScale(0.80);
                this.add.image(400, 300, 'menu').setScale(1.5); 

                const playButton = this.add.image(400, 300, 'play').setInteractive();
                playButton.on('pointerdown', () => {
                    this.scene.start('GameScene'); 
                });
            }
        }

        class GameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameScene' });
    }

    preload() {
        this.load.image('bmapad', 'assets/map.png');
        this.load.image('obstacle', 'assets/maquina-salgadinho.png');
        this.load.spritesheet('player', 'assets/player.png', { frameWidth: 48, frameHeight: 46 });
    }

    create() {
        // Adiciona o mapa de fundo
        this.add.image(400, 300, 'bmapad').setScale(1.5);

        // Criação do grupo de obstáculos
        this.obstacles = this.physics.add.staticGroup();
        this.obstacles.create(200, 300, 'obstacle').setSize(50, 80).setScale(1.4).setOrigin(0.5, 0.42);

        // Criação do jogador
        this.player = this.physics.add.sprite(400, 300, 'player');
        this.player.setScale(1.4);
        this.player.setSize(22, 12).setOrigin(0.5, 1); // Define o tamanho e a origem do jogador
        this.player.setOffset(14, 32); // Ajusta o offset do jogador para alinhar corretamente
        this.player.setCollideWorldBounds(true);

        // Adiciona colisão entre o jogador e os obstáculos
        this.physics.add.collider(this.player, this.obstacles);

        // Animações do jogador
        this.anims.create({ key: 'left', frames: this.anims.generateFrameNumbers('player', { start: 4, end: 7 }), frameRate: 10, repeat: -1 });
        this.anims.create({ key: 'right', frames: this.anims.generateFrameNumbers('player', { start: 8, end: 11 }), frameRate: 10, repeat: -1 });
        this.anims.create({ key: 'up', frames: this.anims.generateFrameNumbers('player', { start: 12, end: 15 }), frameRate: 10, repeat: -1 });
        this.anims.create({ key: 'down', frames: this.anims.generateFrameNumbers('player', { start: 0, end: 3 }), frameRate: 10, repeat: -1 });

        // Configuração das teclas
        this.keys = this.input.keyboard.addKeys({
            W: Phaser.Input.Keyboard.KeyCodes.W,
            A: Phaser.Input.Keyboard.KeyCodes.A,
            S: Phaser.Input.Keyboard.KeyCodes.S,
            D: Phaser.Input.Keyboard.KeyCodes.D
        });
    }

    update() {
        this.player.setVelocity(0);

        if (this.keys.A.isDown) {
            this.player.setVelocityX(-160);
            this.player.anims.play('left', true);
        } else if (this.keys.D.isDown) {
            this.player.setVelocityX(160);
            this.player.anims.play('right', true);
        }

        if (this.keys.W.isDown) {
            this.player.setVelocityY(-160);
            this.player.anims.play('up', true);
        } else if (this.keys.S.isDown) {
            this.player.setVelocityY(160);
            this.player.anims.play('down', true);
        }

        if (!this.keys.W.isDown && !this.keys.A.isDown && !this.keys.S.isDown && !this.keys.D.isDown) {
            this.player.anims.stop();
        }

        // Impede que o jogador ultrapasse o limite superior da tela (y < 150)
        if (this.player.y < 150) {
        this.player.setY(150); // Ajusta a posição do jogador para não ultrapassar 150 de y
    }

    // Impede que o jogador ultrapasse o limite inferior da tela (y > 490)
    if (this.player.y > 490) {
        this.player.setY(490); // Ajusta a posição do jogador para não ultrapassar 490 de y
    }
    }
}


        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: true
                }
            },
            scene: [MenuScene, GameScene] 
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
